[package]
name = "als"
version = "1.0.1"
edition = "2021"

[[bin]]
name = "ALS"
path = "src/main.rs"

[dependencies]
# wgpu (Direct3D 12 or Vulkan) draws the window; glow (OpenGL) is the fallback for older graphics.
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
